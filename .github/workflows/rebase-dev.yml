name: Rebase dev on main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: rebase-dev
  cancel-in-progress: false

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase without automatic conflict resolution
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git fetch origin '+refs/heads/main:refs/remotes/origin/main' '+refs/heads/dev:refs/remotes/origin/dev'
          main=$(git rev-parse origin/main)
          dev=$(git rev-parse origin/dev)
          if git merge-base --is-ancestor "$main" "$dev"; then
            echo 'dev already contains main.'
            exit 0
          fi

          gh api --paginate --slurp "repos/$REPOSITORY/pulls?state=closed&base=main&per_page=100" > "$RUNNER_TEMP/pulls.json"
          jq -r --arg repo "$REPOSITORY" '
            [ .[][] | select(.merged_at != null and .base.ref == "main" and .head.ref == "dev"
                            and .head.repo.full_name == $repo) ]
            | sort_by(.merged_at) | reverse
            | .[] | [.head.sha, .merge_commit_sha, (.number | tostring)] | @tsv
          ' "$RUNNER_TEMP/pulls.json" > "$RUNNER_TEMP/merged-dev-prs.tsv"

          upstream=''
          while IFS=$'\t' read -r head merge number; do
            if [[ "$head" =~ ^[0-9a-f]{40}$ && "$merge" =~ ^[0-9a-f]{40}$ ]] &&
               git merge-base --is-ancestor "$head" "$dev" &&
               git merge-base --is-ancestor "$merge" "$main" &&
               ! git merge-base --is-ancestor "$merge" "$dev"; then
              upstream=$head
              echo "Using merged dev PR #$number ($head) as the replay boundary."
              break
            fi
          done < "$RUNNER_TEMP/merged-dev-prs.tsv"

          git checkout -B dev "$dev"
          if [ -n "$upstream" ]; then
            git rebase --onto "$main" "$upstream" dev
          else
            git rebase "$main" dev
          fi
          git push "--force-with-lease=refs/heads/dev:$dev" origin dev:refs/heads/dev
